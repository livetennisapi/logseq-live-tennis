name: Release Plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLUGIN_NAME: logseq-live-tennis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: |
          mkdir "$PLUGIN_NAME"
          cp README.md LICENSE package.json logo.svg "$PLUGIN_NAME"/
          cp -r dist "$PLUGIN_NAME"/dist
          zip -r "$PLUGIN_NAME.zip" "$PLUGIN_NAME"

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: ${{ env.PLUGIN_NAME }}.zip
          allowUpdates: true
          draft: false
          prerelease: false
